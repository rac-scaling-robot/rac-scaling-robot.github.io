# The project page moved to https://rac.huzheyuan.io (Cloudflare Pages; see README "Deploy").
# GitHub Pages now serves only a redirect, so old links (arXiv, the paper, social posts) to
# https://rac-scaling-robot.github.io/ keep working. Any path, query and #anchor carry over.
name: Redirect GitHub Pages to rac.huzheyuan.io

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Write the redirect page
        run: |
          mkdir _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>RaC: Robot Learning for Long-Horizon Tasks by Scaling Recovery and Correction</title>
          <link rel="canonical" href="https://rac.huzheyuan.io/">
          <script>location.replace('https://rac.huzheyuan.io' + location.pathname + location.search + location.hash);</script>
          <meta http-equiv="refresh" content="0; url=https://rac.huzheyuan.io/">
          </head>
          <body>
          <p>The RaC project page has moved to <a href="https://rac.huzheyuan.io/">rac.huzheyuan.io</a>.</p>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
