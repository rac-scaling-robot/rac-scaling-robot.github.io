# The project page moved to https://rac.huzheyuan.io (Cloudflare Pages; see README "Deploy").
# GitHub Pages now serves only the redirect page in index.html (and its copy 404.html), so old
# links to https://rac-scaling-robot.github.io/ keep working with their path and #anchor.
#
# The repository's Pages source is still "Deploy from a branch" (main, root), which publishes
# those files as they are (.nojekyll turns off Jekyll). This workflow publishes the same two
# files, so the result is the same whichever deploy finishes last, and it keeps working if the
# source is switched to "GitHub Actions".
name: Redirect GitHub Pages to rac.huzheyuan.io

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect the redirect pages
        run: mkdir _site && cp index.html 404.html _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
